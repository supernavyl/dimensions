name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: GUT test suite (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: false

      - name: Import project (builds class_name cache)
        run: godot --path . --headless --import

      - name: Run GUT suite
        run: godot --path . --headless -s addons/gut/gut_cmdln.gd
